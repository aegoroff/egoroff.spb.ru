<!DOCTYPE html>
<html {% if !html_class.is_empty() %}class="{{html_class}}"{% endif %} lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <meta name="author" content="Александр Егоров"/>
    {% if !meta_description.is_empty() %}
    <meta name="description" content="{{ meta_description }}"/>
    {% endif %}
    {% if !keywords.is_empty() %}
    <meta name="keywords" content="{{ keywords }}"/>
    {% endif %}
    {% block meta %}
    {% endblock %}

    <link href="/favicon.ico" rel="icon"/>
    <link href="https://www.egoroff.spb.ru/auth" rel="authorization_endpoint"/>
    <link href="https://www.egoroff.spb.ru/token" rel="token_endpoint"/>
    <link href="https://www.egoroff.spb.ru/micropub/" rel="micropub"/>
    
    <!-- Google Fonts optimization (CSP-compatible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:wght@400;700&display=swap">
    
    <title>{{title}}{% if !title_path.is_empty() %}{{" | "}}{{title_path}}{% endif %}</title>
    <link href="/blog/recent.atom"
          rel="alternate"
          title="Recent Posts"
          type="application/atom+xml"/>
    <!-- built styles will be auto injected -->
</head>
<body>
<noscript>
    <strong>We're sorry but this site doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<div id="app" datafld="{{title}}"></div>
{% block content %}{% endblock %}
<footer class="footer bg-light" role="contentinfo">
    <div class="container text-center">
        <p class="text-muted mb-0">&copy; 2002-{{ year }} - Александр Егоров</p>
    </div>
</footer>
    <!-- built scripts will be auto injected -->
</body>
</html>
